<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" defer />
    <script src="./scipt.js" defer></script>
    <title>Personal Blog</title>
  </head>
  <body>
    <section id="post-form" class="card">
      <h1 id="form-heading">Create New Post</h1>
      <form action="#" id="form">
        <div class="form-group">
          <label for="title"></label>
          <input type="text" id="title" name="title" />
          <span class="error-message" id="titleError"></span>
        </div>
        <div class="form-group">
          <label for="content"></label>
          <input type="text" id="content" name="content" />
          <small>Should be atleast 10 characters</small>
          <span class="error-message" id="contentError"></span>
        </div>
        <div class="form-actions">
          <button id="submit-btn" type="submit">Submit</button>
          <button id="cancl-edt-btn" type="button">Cancel Edit</button>
        </div>
      </form>
    </section>
    <section id="post-display" class="card">
      <h2>Posts</h2>
      <div id="post-container">
        <ul id="post-list"></ul>
      </div>
    </section>
  </body>
</html>
