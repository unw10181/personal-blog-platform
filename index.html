<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="./script.js" defer></script>
    <title>Personal Blog</title>
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h1 id="form-heading" class="h4 mb-3">Create New Post</h1>

          <form action="#" id="form">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" name="title" class="form-control" />
              <small id="titleError" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label for="content" class="form-label">Post</label>
              <textarea
                id="content"
                name="content"
                class="form-control"
                rows="4"
              ></textarea>
              <small class="text-muted d-block">Minimum: 10 characters</small>
              <small id="contentError" class="text-danger"></small>
            </div>

            <div class="d-flex gap-2">
              <button id="submit-btn" type="submit" class="btn btn-primary">
                Submit
              </button>

              <button
                id="cancl-edt-btn"
                type="button"
                class="btn btn-secondary"
                style="display: none"
              >
                Cancel Edit
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Posts</h2>

          <ul id="post-list" class="list-group"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
